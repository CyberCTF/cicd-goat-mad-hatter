# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Mad Hatter (CI/CD Goat, CICD-SEC-4 Poisoned Pipeline Execution): a live, two-machine CI/CD lab.
# A Jenkins controller builds Wonderland's mad-hatter APPLICATION repository (hosted on Gitea), but
# the pipeline definition lives in a SEPARATE, protected repository (mad-hatter-pipeline) the
# attacker cannot modify — so a Direct-PPE (editing the Jenkinsfile) is impossible. That pipeline
# runs `make` inside the application checkout with the release token (flag3) bound into the build
# environment. An attacker with write access to the APPLICATION repo edits its Makefile — the build
# script the protected pipeline invokes — to print flag3 in a form the console will not mask; the
# SCM-poll trigger builds the pushed branch and the flag lands in the job console. This is
# Indirect-PPE (I-PPE). See https://www.isoloom.com.
version: 1
name: cicd-goat-mad-hatter

networks:
  lab: { cidr: 10.39.0.0/24 }

# The per-player flag, issued by CyberCTF and handed to the lab by the launcher as a FILE (never an
# environment value, so it never shows in `docker inspect`, an image layer or a generated file). The
# Jenkins entrypoint stages it into the directory JCasC reads file secrets from, so the flag3
# credential (a username/password whose password IS the flag) resolves at boot. Optional: an offline
# start (local, CI) leaves it empty and the lab stages its inert development placeholder instead, so
# the lab still comes up and is solvable without a launcher.
#   CTF_FLAG_MAD_HATTER  objective `mad-hatter`  (SECRET: Wonderland's flag3 release token)
inputs:
  CTF_FLAG_MAD_HATTER:
    description: the mad-hatter flag, injected into the Jenkins credential store as flag3 (GLOBAL)

machines:
  # Wonderland's git host: Gitea, holding TWO private repositories. The setup job provisions the org,
  # the attacker user (alice) and the Jenkins poller (jenkins), then pushes both sample projects:
  #   - Wonderland/mad-hatter          the application (alice: WRITE, jenkins: read) — holds the Makefile
  #   - Wonderland/mad-hatter-pipeline the protected pipeline (alice: read, jenkins: read) — holds the Jenkinsfile
  # No `publish` number: `publish: true` asks the runner for a free host port it picks at `up` time
  # (dynamic), so two labs never collide.
  gitea:
    app:
      build: build/gitea
    networks: { lab: 12 }
    resources: { cpus: 1, memory_mb: 1024 }
    volumes: { data: /data }
    ports:
      web: { port: 3000, protocol: http, publish: true }
    setup: [build/gitea/seed.sh]

  # Wonderland's Jenkins controller: a git-backed multibranch pipeline whose BRANCH SOURCE is the
  # mad-hatter application repo (rescanned every minute — the SCM-poll trigger), but whose Jenkinsfile
  # is fetched from the separate mad-hatter-pipeline repo (the Remote Jenkinsfile Provider), so the
  # pipeline is read-only to the attacker. flag3 is a GLOBAL-scope credential bound only inside the
  # `make` stage. The per-player flag arrives as a root-only file; only the entrypoint reads it.
  jenkins:
    app:
      build: build/jenkins
    networks: { lab: 10 }
    resources: { cpus: 2, memory_mb: 2048 }
    ports:
      web: { port: 8080, protocol: http, publish: true }
    files:
      - { path: /run/lab/secrets/flag3, input: CTF_FLAG_MAD_HATTER }

# From the player's side, on every target: reachability checks that both services answer, and the
# intended path as a solver that runs inside the Jenkins controller — it performs Indirect-PPE end to
# end (clone the application repo with the attacker's write creds, poison the MAKEFILE the protected
# pipeline runs, push + open a PR, read the build console) and proves the GLOBAL-scope flag was
# exfiltrated, without ever printing it. Jenkins is slow to boot and the pipeline needs a scan + a
# build, so the waits are generous.
checks:
  - name: the Gitea git host answers
    http: http://gitea:3000/
    wait: 3m
  - name: the Jenkins controller answers
    http: http://jenkins:8080/login
    wait: 5m
  - name: flag3 is exfiltrated via indirect poisoned pipeline execution of the Makefile
    from: jenkins
    exec: bash /usr/local/bin/mh-solve
    wait: 8m

# Shown when the lab is up.
message: |
  Wonderland runs CI on **Jenkins**, building the **Wonderland/mad-hatter** application repository
  (hosted on **Gitea**) on every branch and pull request. You have an account with **write** access
  to that application repo.

  - Gitea:   {{ machines.gitea.ports.web.url }}   (sign in as `alice` / `alice`)
  - Jenkins: {{ machines.jenkins.ports.web.url }} (sign in as `admin` / `admin` to read build consoles)

  The pipeline's `Jenkinsfile` is **not** in the application repo — it lives in a separate,
  protected repository (`Wonderland/mad-hatter-pipeline`) that you can read but not modify, so you
  cannot edit the pipeline directly. But that pipeline runs `make` inside the application checkout
  with Wonderland's release token, `flag3`, bound into the build environment. Whoever controls the
  **Makefile** controls what `make` runs.

  ```
  git clone {{ machines.gitea.ports.web.url }}Wonderland/mad-hatter.git
  ```

  Edit the application's `Makefile` so its default target prints `flag3` in a form the console will
  not mask (Jenkins masks the raw value *and* its plain base64 — reverse it first, e.g.
  `echo "$FLAG" | rev | base64`), push the branch and open a pull request; then read the build's
  console output in Jenkins.
